server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API + Swagger go to the Go backend. LLM calls can be slow, so allow long reads.
  location ~ ^/(api/|swagger|openapi.yaml) {
    proxy_pass http://backend:8080;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
