# PRD Assistant: MySQL + Go API + React UI.
#   docker compose up --build            -> UI on http://localhost:3000
#   docker compose --profile ollama up   -> also starts a local LLM server (Ollama)
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: prd_assistant
      MYSQL_USER: prd
      MYSQL_PASSWORD: prdpass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      STORE: mysql
      MYSQL_DSN: prd:prdpass@tcp(mysql:3306)/prd_assistant?parseTime=true&charset=utf8mb4
      # Where "Use a local LLM" looks by default. Ollama on your own machine:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080" # API + Swagger UI (http://localhost:8080/swagger)

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

  # Optional: run the LLM inside Docker too. Start with `--profile ollama`, set
  # OLLAMA_URL=http://ollama:11434, then pull a model once:
  #   docker compose exec ollama ollama pull llama3.2
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  mysql_data:
  ollama_data:
